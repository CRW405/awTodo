<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Todo</title>
		<link rel="stylesheet" href="./styles.css" />
	</head>
	<body>
		<header>
			<h1>Todo</h1>

			<div id="task-creation">
				<h2>New Task</h2>
				<input type="text" id="new-title" placeholder="Task title" />
				<textarea
					rows="3"
					cols="10"
					id="new-desc"
					placeholder="Task description"
				></textarea>
				<input type="datetime-local" id="new-due" />
				<input type="number" value="1" id="new-priority" />
				<textarea
					rows="3"
					cols="10"
					id="new-note"
					placeholder="Task description"
				></textarea>
				<textarea
					rows="3"
					cols="10"
					id="new-checklist"
					placeholder="Checklist Item 1&#10;Checklist Item 2&#10;Checklist Item 3"
				></textarea>
				<select name="project" id="new-select-project"></select>
				<button id="add-task">Add Task</button>
			</div>

			<div id="project-creation">
				<h2>New Project</h2>
				<input type="text" id="new-project" />
				<button id="add-project">Add Project</button>
			</div>
		</header>

		<main>
			<div id="select-project">
				<h2>Projects</h2>
				<ul id="project-list">
					<li class="project-selection" id="all-projects">All</li>
				</ul>
			</div>

			<div id="task-list">
				<h2>Tasks</h2>
				<ul id="tasks"></ul>
			</div>
		</main>

		<script src="./todo.js" type="module"></script>
		<script src="./creation.js" type="module"></script>
		<script src="./view.js" type="module"></script>
	</body>
</html>
